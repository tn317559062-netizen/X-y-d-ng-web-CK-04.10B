<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 align="center">Đăng ký tài khoản</h2>
    <fieldset>
        <legend>Tài khoản</legend>
        <p>
            Tên đăng nhập:
            <input type="text" name="tendangnhap" id="">
        
        </p>
        <p>
            Mật khẩu:
            <input type="password" name="matkhau" id="">
        </p>
        <p>
            Xác nhận mật khẩu:
            <input type="password" name="xacnhanmatkhau" id="">
        </p>
    </fieldset>
    <fieldset>
        <legend>Thông tin cá nhân</legend>
        <p>
            Họ và tên:
            <input type="text" name="ho va ten" id="">
        </p>
        <p>
            Ngày sinh:
            <input type="date" name="ngay sinh" id="">
        </p>
        <p>
            Giới tính:
            <input type="radio" name="gt" id="">Nam
            <input type="radio" name="gt" id="">Nữ
            <input type="radio" name="gt" id="">Khác
        </p>
        <p>
            Quốc gia:
            <select name="quocgia">
                <option>Việt Nam</option>
                <option>Hoa Kỳ</option>
                <option>Nhật Bản</option>
                <option>Hàn Quốc</option>
            </select>
        </p>
        <fieldset>
            <legend>Tùy chọn</legend>
            <p>
                <input type="checkbox" name="tuychon" id="">Tôi đồng ý với điều khoản sử dụng
            </p>
        </fieldset>
        <p><input type="button" value="Đăng ký"></p>
    </fieldset>
</body>
</html>
