<body>

    <div class="khung">

        <h2 align="center">Đăng ký thành viên</h2>

        <div class="noidung">

            <form>

                <fieldset>
                    <legend>Thông tin cơ bản</legend>

                    <p>
                        Họ tên:
                        <input type="text" name="hoten"> <br>
                    </p>
                    <p> 
                        Ngày sinh:
                        <input type="date" name="ngaysinh"> <br>
                    </p>
                     <p>
                    Quốc tịch:
                        <select name="quoctich">
                            <option>Việt Nam</option>
                            <option>Hoa Kỳ</option>
                            <option>Nhật Bản</option>
                            <option>Hàn Quốc</option>
                        </select>
                  </p>
                </fieldset>
                <fieldset>
                    <legend>Bạn muốn nhận thông tin qua</legend>

                    <input type="checkbox" name="email">
                    Email
                    <br>

                    <input type="checkbox" name="sms">
                    Tin nhắn SMS
                    <br>

                    <input type="checkbox" name="buudien">
                    Bưu điện

                </fieldset>

                <input type="submit" value="Đăng ký">

            </form>

        </div>

    </div>

</body>
